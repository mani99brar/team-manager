<title>Dispatch Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #e9ebe6; --grid: #d5d9d1; --surface: #fbfbf8; --surface-2: #f1f2ee; --fg: #151b18; --muted: #545e58; --border: #c8cdc4; --border-strong: #a3aaa0;
  --edge: #7d8780; --edge-soft: #b8beb5;
  --accent: #5a3ec8; --accent-fg: #ffffff; --accent-soft: #e7e2fb; --focus: #5a3ec8;
  --ok: #17663b; --ok-soft: #d9f0e1; --run: #1d4fc4; --run-soft: #dde7fb; --warn: #8f4700; --warn-soft: #fde6cc; --fail: #a51d27; --fail-soft: #fadcdf; --pause: #714a00; --pause-soft: #fbedc4; --idle: #56606c; --idle-soft: #e4e6e9;
  --p0: #a51d27; --p1: #a33806; --p2: #4b5563; --sev-fg: #ffffff;
  --font-body: "Atkinson Hyperlegible Next", system-ui, "Segoe UI", Roboto, sans-serif; --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 30, 25, 0.06); --shadow-float: 0 10px 30px -12px rgba(20, 30, 25, 0.28), 0 2px 6px -2px rgba(20, 30, 25, 0.12);
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --grid: #1c2320; --surface: #171c1a; --surface-2: #1e2522; --fg: #e6ebe7; --muted: #9ba7a0; --border: #2b3430; --border-strong: #3e4944;
    --edge: #7f8b85; --edge-soft: #3b4641;
    --accent: #a995ff; --accent-fg: #0d1210; --accent-soft: #2a2347; --focus: #a995ff;
    --ok: #62d08f; --ok-soft: #163323; --run: #89abff; --run-soft: #19264a; --warn: #f6ad5c; --warn-soft: #3c2811; --fail: #ff8a92; --fail-soft: #44181c; --pause: #ecc24a; --pause-soft: #392f12; --idle: #a9b2bf; --idle-soft: #262d33;
    --p0: #ff8a92; --p1: #f6ad5c; --p2: #a9b2bf; --sev-fg: #0d1210; --shadow: none; --shadow-float: 0 14px 34px -12px rgba(0, 0, 0, 0.7), 0 2px 6px -2px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --grid: #1c2320; --surface: #171c1a; --surface-2: #1e2522; --fg: #e6ebe7; --muted: #9ba7a0; --border: #2b3430; --border-strong: #3e4944;
  --edge: #7f8b85; --edge-soft: #3b4641;
  --accent: #a995ff; --accent-fg: #0d1210; --accent-soft: #2a2347; --focus: #a995ff;
  --ok: #62d08f; --ok-soft: #163323; --run: #89abff; --run-soft: #19264a; --warn: #f6ad5c; --warn-soft: #3c2811; --fail: #ff8a92; --fail-soft: #44181c; --pause: #ecc24a; --pause-soft: #392f12; --idle: #a9b2bf; --idle-soft: #262d33;
  --p0: #ff8a92; --p1: #f6ad5c; --p2: #a9b2bf; --sev-fg: #0d1210; --shadow: none; --shadow-float: 0 14px 34px -12px rgba(0, 0, 0, 0.7), 0 2px 6px -2px rgba(0, 0, 0, 0.5); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--border-strong) transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; caret-color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--fg); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 13px; }
kbd { font-family: var(--font-mono); font-size: 11.5px; padding: 0 5px; min-width: 18px; display: inline-block; text-align: center; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--fg); line-height: 17px; }
.nr { font-style: italic; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* tones: every tone is a strong colour, a soft fill, a glyph and a word */
.t-ok { --tone: var(--ok); --tone-soft: var(--ok-soft); }
.t-run { --tone: var(--run); --tone-soft: var(--run-soft); }
.t-warn { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.t-fail { --tone: var(--fail); --tone-soft: var(--fail-soft); }
.t-pause { --tone: var(--pause); --tone-soft: var(--pause-soft); }
.t-idle { --tone: var(--idle); --tone-soft: var(--idle-soft); }
.g { width: 16px; height: 16px; flex: none; color: var(--tone); display: block; }
.g.lg { width: 22px; height: 22px; }
.g.sm { width: 14px; height: 14px; }
.ic { width: 16px; height: 16px; flex: none; display: block; }
.ic.sm { width: 14px; height: 14px; }
.word { font-size: 12px; font-weight: 700; color: var(--tone); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 5px; border-radius: 999px; background: var(--tone-soft); color: var(--tone); font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill .g { width: 15px; height: 15px; }
.ex { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; border: 1px dashed var(--idle); background: var(--idle-soft); color: var(--idle); font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.sev { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 5px; border-radius: 4px; color: var(--sev-fg); background: var(--p2); }
.sev.p0 { background: var(--p0); } .sev.p1 { background: var(--p1); }
.sevc { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.vis { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px 0 6px; border-radius: 999px; background: var(--tone-soft); color: var(--tone); font-size: 11.5px; font-weight: 700; white-space: nowrap; font-family: var(--font-body); }
.vis .ic { width: 12px; height: 12px; }
.nog { font-size: 12px; font-weight: 600; color: var(--idle); background: var(--idle-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }

/* app frame */
.app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; gap: 6px; height: 52px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); min-width: 0; }
.brand { font-weight: 700; font-size: 15.5px; margin-right: 10px; white-space: nowrap; }
.tab { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid var(--border); white-space: nowrap; }
.tab:hover { background: var(--surface-2); text-decoration: none; }
.tab[aria-current="page"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none; white-space: nowrap; transition: background-color 150ms var(--ease); }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.btn.quiet:hover { color: var(--fg); background: var(--surface-2); }

.strip { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--border); min-width: 0; }
.situation { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; min-width: 0; flex: 1 1 420px; }
.situation .seg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.situation .dot { color: var(--border-strong); }
.situation b { font-weight: 700; }
.situation .quiet { color: var(--muted); }
.switch { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; padding: 2px; background: var(--surface); gap: 2px; flex: none; max-width: 100%; }
.switch button { border: 0; background: none; border-radius: 8px; min-height: 32px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.switch button:hover { color: var(--fg); }
.switch button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.exnote { flex-basis: 100%; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

.chiprow { display: none; gap: 8px; overflow-x: auto; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; flex: none; }
.chip[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.desk { display: grid; grid-template-columns: 280px minmax(400px, 520px) minmax(0, 1fr); min-height: 0; }

/* rail */
.rail { background: var(--surface-2); border-right: 1px solid var(--border); overflow: auto; padding: 14px 10px 32px; min-width: 0; }
.rail a { color: var(--fg); text-decoration: none; }
.rail a:hover { background: var(--surface); }
.rail a[aria-current="page"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.rail-home + .rail-home { margin-top: 2px; }
.rail-home { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; font-weight: 700; font-size: 15px; }
.rh-n { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.rh-n.t-warn { color: var(--warn); }
.rail-h { display: flex; align-items: baseline; gap: 6px; margin: 22px 12px 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rail-h span { letter-spacing: 0; font-weight: 700; color: var(--fg); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pr { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 10px; align-items: center; min-height: 56px; padding: 8px 12px; border-radius: 10px; }
.pr > .g { align-self: start; margin-top: 2px; }
.pr-m { display: grid; gap: 1px; min-width: 0; }
.pr-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; }
.pr-n { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.nw { white-space: nowrap; }
.pr-s { font-size: 12.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.pr-b { align-self: center; font-size: 12px; font-weight: 700; color: var(--tone); background: var(--tone-soft); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.pr-up { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.rail-foot { margin: 20px 12px 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* queue (middle) */
.queue { overflow: auto; min-width: 0; padding: 20px 24px 48px; border-right: 1px solid var(--border); background-image: radial-gradient(var(--grid) 1.1px, transparent 1.3px); background-size: 18px 18px; background-attachment: local; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); min-height: 20px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); text-decoration: underline; }
.crumbs .ic { width: 12px; height: 12px; color: var(--border-strong); }
.crumbs [aria-current] { color: var(--fg); font-weight: 600; }
.qh h1 { font-size: 20px; font-weight: 700; line-height: 1.25; margin: 6px 0 4px; overflow-wrap: anywhere; }
.qh h1.mono { font-size: 20px; }
.meta { font-size: 12.5px; color: var(--muted); }
.qh .meta { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.desc { margin: 10px 0 0; font-size: 15px; max-width: 64ch; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 28px; }
.search { position: relative; margin-top: 16px; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; height: 40px; padding: 0 44px 0 36px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.keys span { display: inline-flex; align-items: center; gap: 4px; }

.qsec { margin-top: 28px; }
.qsec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin: 0 2px 8px; }
.qsec-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.qsec-head .n { font-size: 13px; font-weight: 700; color: var(--fg); }
.qsec-head .aside { margin-left: auto; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.empty { margin: 0; padding: 14px 16px; font-size: 13px; color: var(--muted); }
.empty-f { display: none; }
.sheet.filtered-empty .empty-f { display: block; }

.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; width: 100%; min-height: 60px; padding: 10px 14px; margin: 0; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer; color: var(--fg); position: relative; transition: background-color 150ms var(--ease); }
.sheet > .row:first-child, .sheet > :first-child .row { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row[aria-selected="true"] { background: var(--accent-soft); }
.row[aria-selected="true"]::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--accent); border-radius: inherit; pointer-events: none; }
.row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.row > .g { grid-row: 1; align-self: center; }
.r1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.rid { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.r-time { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.r2 { grid-column: 2; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.r2 b { color: var(--fg); font-weight: 600; }
.r2 code { font-size: 12.5px; color: var(--fg); }
.r2b { grid-column: 3; display: inline-flex; gap: 10px; align-items: center; justify-content: flex-end; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.fold { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 14px; border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--fg); text-align: left; }
.fold:hover { background: var(--surface-2); }
.fold .ic { color: var(--muted); transition: transform 150ms var(--ease); }
.fold[aria-expanded="true"] .ic { transform: rotate(90deg); }
.fold .meta { margin-left: auto; font-weight: 400; }
.fold-body > .row:first-child { border-top: 1px solid var(--border); }

/* feature page: ledger + chain */
.lrow { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; min-height: 48px; padding: 8px 14px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer; color: var(--fg); font-size: 13px; }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--surface-2); }
.lrow .rid { font-size: 13px; }
.lrow code { font-weight: 700; }
.lrow .lmid { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; min-width: 0; }
.lrow .where { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; min-width: 0; }
.lrow .when { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.chain { list-style: none; margin: 0; padding: 4px 0; position: relative; }
.cnode { position: relative; }
.cnode::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: var(--edge-soft); }
.cnode:first-child::before { top: 24px; }
.cnode:last-child::before { bottom: calc(100% - 24px); }
.cnode:only-child::before { display: none; }
.crow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 3px 12px; width: 100%; padding: 14px 14px 14px 14px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--fg); position: relative; transition: background-color 150ms var(--ease); }
.crow:hover { background: var(--surface-2); }
.crow[aria-selected="true"] { background: var(--accent-soft); }
.crow[aria-selected="true"]::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--accent); pointer-events: none; }
.crow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.crow > .g { margin-top: 1px; box-shadow: 0 0 0 4px var(--surface); border-radius: 50%; background: var(--surface); }
.crow[aria-selected="true"] > .g { box-shadow: 0 0 0 4px var(--accent-soft); background: var(--accent-soft); }
.crow .c1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.crow .c-time { font-size: 12.5px; color: var(--muted); white-space: nowrap; text-align: right; }
.crow .c2 { grid-column: 2 / 4; font-size: 13.5px; color: var(--fg); line-height: 1.45; }
.crow .c2 .at { font-weight: 600; }
.crow .c3 { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); margin-top: 3px; align-items: center; }
.crow .c3 code { font-size: 12px; color: var(--fg); }
.says { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); }
.says .ic { color: var(--muted); width: 13px; height: 13px; }
.says i { color: var(--muted); }
.chain-note { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }

.calm { padding: 16px; display: grid; gap: 10px; font-size: 14px; }
.calm p { margin: 0; }

/* stage + reading pane */
.stage { overflow: hidden; min-width: 0; min-height: 0; padding: 20px 24px; background-color: var(--bg); background-image: radial-gradient(var(--grid) 1.1px, transparent 1.3px); background-size: 18px 18px; display: flex; flex-direction: column; align-items: center; }
.m-bar { display: none; }
.panel { container-type: inline-size; width: 100%; max-width: 680px; max-height: 100%; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-float); overflow: hidden; }
.panel::before { content: ""; height: 5px; flex: none; background: var(--tone, var(--border-strong)); }
.panel.t-none { --tone: var(--border-strong); }
@media (prefers-reduced-motion: no-preference) {
  .panel.fade { animation: fadein 150ms var(--ease); }
  @keyframes fadein { from { opacity: .35; } to { opacity: 1; } }
  .row .g.live, .crow .g.live { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
}
.p-head { padding: 16px 22px 14px; flex: none; border-bottom: 1px solid var(--border); }
.p-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; }
.p-top h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25; font-family: var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.p-sub { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.p-sub a { color: var(--accent); }
.p-body { overflow: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.p-sec { padding: 16px 22px; border-top: 1px solid var(--border); }
.p-sec:first-child { border-top: 0; }
.p-sec h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
.p-sec h3 .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; }
.lead-at { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.35; }
.lead-at .when { font-weight: 400; color: var(--muted); font-size: 13px; }
.lead-why { margin: 6px 0 0; font-size: 15px; max-width: 70ch; }
.lead-why code { font-size: 13px; }
.lineage { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.lineage .says a { font-family: var(--font-mono); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; margin: 0; border-top: 1px solid var(--border); }
.fact { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.fact dt { font-size: 12.5px; color: var(--muted); }
.fact dd { margin: 0; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.fact dd .mono { font-size: 12.5px; }
.fact dd .nr { font-weight: 400; }
.lanes { display: flex; flex-wrap: wrap; gap: 4px; }
.lane { font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); }
.steps { list-style: none; margin: 0; padding: 0; columns: 2 220px; column-gap: 20px; }
.steps li { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13px; break-inside: avoid; }
.steps li .sw { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.steps li.here { font-weight: 700; }
.steps li.here .sl { text-decoration: underline; text-decoration-color: var(--tone); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.revrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.fcount { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; }
.note { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.gh { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.gh li { display: grid; grid-template-columns: 16px 76px minmax(0, 1fr); gap: 10px; align-items: baseline; min-height: 30px; padding: 4px 0; font-size: 13.5px; }
.gh li .ic { align-self: center; color: var(--muted); }
.gh li .k { color: var(--muted); font-size: 12.5px; }
.gh li .v { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.gh li .v code { overflow-wrap: anywhere; }
.gh li.landed .v b { font-weight: 700; }
.ext { display: inline-flex; align-items: center; gap: 4px; }
.ext .ic { width: 12px; height: 12px; }
.cmd { display: flex; align-items: stretch; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.cmd code { flex: 1; min-width: 0; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; align-self: center; }
.cmd button { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 92px; justify-content: center; padding: 0 12px; border: 0; border-left: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600; }
.cmd button:hover { background: var(--surface-2); }
.cmd + .cmd { margin-top: 8px; }
.cmd-why { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.cmd-or { margin: 10px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
.p-foot { padding: 12px 22px 16px; border-top: 1px solid var(--border); flex: none; display: grid; gap: 8px; }
.ink { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 14px; text-decoration: none; border: 0; cursor: pointer; }
.ink:hover { text-decoration: none; opacity: .92; }
.ink kbd { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 45%, transparent); }
.mini { list-style: none; margin: 0; padding: 0; }
.mini li { display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 30px; font-size: 13px; }
.mini li .why { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini li .when { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.prs { list-style: none; margin: 0; padding: 0; }
.prs li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.prs li:first-child { border-top: 0; padding-top: 0; }
.prs li .ic { margin-top: 2px; color: var(--muted); }
.prs .pm { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.prs .pm code { font-size: 12px; }
.mine { font-size: 11.5px; font-weight: 700; color: var(--accent); }
.co { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.co li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 13.5px; }
.co li .meta code { font-size: 12px; }
.ahead { color: var(--fg); font-weight: 700; }

.about { margin-top: 36px; border-top: 1px solid var(--border); padding-top: 8px; }
.about summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); list-style: none; }
.about summary::-webkit-details-marker { display: none; }
.about summary .ic { transition: transform 150ms var(--ease); }
.about[open] summary .ic { transform: rotate(90deg); }
.about-body { font-size: 13px; color: var(--fg); display: grid; gap: 12px; padding-bottom: 8px; }
.about-body h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
.about-body ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.about-body p { margin: 0; color: var(--muted); }
.stub { padding: 20px 18px; display: grid; gap: 12px; font-size: 14px; }
.stub p { margin: 0; }
.stub code { overflow-wrap: anywhere; }

/* project page: the queue column widens; rows carry the step chart */
[hidden] { display: none !important; }
.desk.wide { grid-template-columns: 264px minmax(560px, 1fr) minmax(400px, 520px); }
.qh .meta .vis { margin-left: 2px; }
.figs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 12px 0 0; font-size: 13px; }
.fg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fg b { font-weight: 700; color: var(--fg); }
.fg.q { color: var(--muted); }

.chart { container-type: inline-size; container-name: chart; display: grid; gap: 12px; }
.axis, .ends { display: grid; grid-template-columns: minmax(0, 1fr); padding: 0 15px; }
.axis { position: sticky; top: -20px; z-index: 2; padding-top: 8px; padding-bottom: 6px; background: var(--bg); border-bottom: 1px solid var(--border); }
.axis-l, .ends-l { font-size: 12px; color: var(--muted); }
.axis-l { display: none; }
.axis-t, .ends-t, .trk { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.ax { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; }
.fgroup { overflow: visible; }
.fgroup .row { border-top: 1px solid var(--border); }
.fgroup > .row:first-child { border-top: 0; border-radius: 8px 8px 0 0; }
.row.fh, .row.cr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; min-height: 56px; padding: 10px 14px; }
.row.fh { background: var(--surface-2); }
.row.fh:hover { background: var(--surface); }
.row.fh[aria-selected="true"] { background: var(--accent-soft); }
.cr1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cr1 .rid { font-size: 13.5px; flex: none; }
.cr1 .fid { font-family: var(--font-mono); font-size: 14px; font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.cr-r { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; flex: none; }
.res { display: inline-flex; align-items: baseline; gap: 5px; }
.res code { color: var(--fg); font-size: 12.5px; font-weight: 600; }
.res .off { color: var(--fg); font-weight: 600; }
.wl { min-width: 52px; text-align: right; }
.tag { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; flex: none; }
.tag .ic { width: 11px; height: 11px; }
.tag i { font-weight: 400; }
.cr2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cr2 b { color: var(--fg); font-weight: 600; }
.cr2 code { font-size: 12.5px; color: var(--fg); }
.fh .cr2 { white-space: normal; }

/* the track: segment, item, segment … per phase; solid up to the stop, dotted after */
.trk { margin-top: 10px; height: 22px; align-items: center; }
.pc { display: flex; align-items: center; height: 22px; min-width: 0; }
.sg { flex: 1 1 0; min-width: 1px; height: 0; border-top: 2px solid var(--edge); }
.sg.dt { border-top: 2px dotted var(--edge-soft); }
.pc:last-child > .sg:last-child { visibility: hidden; }
.ln-full, .ln-one { display: flex; align-items: center; flex: 1 1 0; min-width: 0; height: 22px; }
.ln-one { display: none; }
.it { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.it .g { width: 18px; height: 18px; background: var(--surface); border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.row.cr:hover .it .g { background: var(--surface-2); box-shadow: 0 0 0 2px var(--surface-2); }
.row.cr[aria-selected="true"] .it .g { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.d { display: block; width: 8px; height: 8px; border-radius: 50%; border: 1.6px solid var(--edge-soft); background: var(--surface); }
.d.r { border-color: var(--edge); background: var(--edge); }
.d.f { border-color: var(--tone); background: var(--tone); }
.att { position: absolute; bottom: calc(100% + 1px); left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; font-weight: 600; line-height: 1; color: var(--fg); white-space: nowrap; }
.it.here .att { bottom: calc(100% + 2px); }

.ends { padding-top: 8px; padding-bottom: 10px; border-top: 1px solid var(--border); gap: 4px; }
.en { font-size: 12.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.en.hot { color: var(--fg); font-weight: 700; }
.en.land { color: var(--ok); font-weight: 600; }
.tot .ends { border-top: 0; }
.skey { border-top: 1px solid var(--border); }
.skey summary { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 600; color: var(--muted); }
.skey summary::-webkit-details-marker { display: none; }
.skey summary .ic { transition: transform 150ms var(--ease); }
.skey[open] summary .ic { transform: rotate(90deg); }
.skey summary .meta { margin-left: auto; font-weight: 400; }
.skey ul { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 4px; }
.skey li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.skey li .k { color: var(--muted); }
.fgroup .empty-f { border-top: 1px solid var(--border); }
.chart .fgroup.filtered-empty { display: none; }
.ahead-w { color: var(--fg); }

.commits { list-style: none; margin: 0; padding: 0; display: grid; }
.commits li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.commits li:first-child { border-top: 0; padding-top: 0; }
.commits code { font-weight: 600; }
.commits .kind { font-size: 12px; font-weight: 700; color: var(--muted); }
.commits .k-run .kind, .commits .k-merge .kind { color: var(--ok); }
.commits .subj { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }

/* narrow chart: phase labels alternate on two lines, dots shrink */
@container chart (max-width: 540px) {
  .axis-t { height: 30px; align-items: start; }
  .ax.lo { align-self: end; }
  .d { width: 6px; height: 6px; border-width: 1.4px; }
}
@container chart (max-width: 440px) {
  .ln-full { display: none; }
  .ln-one { display: flex; }
  .ax { font-size: 11.5px; }
  .d { width: 5px; height: 5px; }
  .it .g { width: 16px; height: 16px; }
}
@media (max-width: 1199px) { .desk.wide { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
@media (max-width: 760px) {
  .row.fh, .row.cr { padding: 10px 12px; }
  .axis, .ends { padding-left: 13px; padding-right: 13px; }
  .axis { top: 0; }
  .cr-r .wl { display: none; }
  .commits li { grid-template-columns: 64px minmax(0, 1fr); }
  .crumbs a { display: inline-flex; align-items: center; min-height: 44px; }
  .mini li .why { white-space: normal; }
}

/* dedicated project page: the page owns the width; the reading pane docks only while something is selected */
.desk.proj { grid-template-columns: 280px minmax(0, 1fr); }
.desk.proj .stage { display: none; }
.desk.proj.docked { grid-template-columns: 280px minmax(0, 1fr) minmax(380px, 460px); }
.desk.proj.docked .stage { display: flex; }
.desk.proj .queue { padding: 24px 32px 48px; border-right: 0; }
.desk.proj.docked .queue { border-right: 1px solid var(--border); }
.dock-bar { width: 100%; max-width: 680px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -8px 0 8px; font-size: 12.5px; color: var(--muted); }
.desk:not(.proj) .dock-bar { display: none; }
.ph { display: grid; gap: 6px; max-width: 1180px; }
.ph-t { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; }
.ph-t h1 { margin: 2px 0 0; font-size: 24px; font-weight: 700; line-height: 1.2; }
.repo-l { font-size: 13.5px; color: var(--fg); text-decoration: none; }
.repo-l:hover { color: var(--accent); }
.repo-l .ic { color: var(--muted); }
.ph .meta { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.ph .meta a { color: var(--muted); }
.ph .search { max-width: 560px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.jump button { min-height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; color: var(--fg); cursor: pointer; }
.jump button:hover { background: var(--surface-2); }
.gcard:focus, .qsec:focus { outline: none; }
.gcard:focus-visible, .qsec:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pgrid { container-type: inline-size; container-name: pg; max-width: 1180px; }
.pside { display: grid; gap: 14px; align-content: start; margin-top: 28px; }
@container pg (min-width: 980px) {
  .pg2 { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 28px; align-items: start; }
}
.gcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 14px 16px 16px; min-width: 0; }
.gcard h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.gcard h3 .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; }
.gline { margin: 0; font-size: 14px; }
.gsub { margin: 6px 0 0; font-size: 13px; color: var(--muted); max-width: 60ch; }
.gsub code, .gline code { font-size: 12.5px; color: var(--fg); }
.row.gbtn { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 12px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 600; }
.row.gbtn span { flex: 1; }
.row.gbtn .ic { color: var(--muted); }
.gl + .gl { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.gl h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.gl h4 span { font-weight: 400; color: var(--muted); }
.gcard .prs li { padding: 7px 0; }
.gcard .prs li:first-child { padding-top: 2px; }
.prs .num { font-family: var(--font-mono); font-size: 12.5px; }
.prs .pm .dr { font-weight: 700; color: var(--idle); }
.prs .pw { grid-column: 2; font-size: 12.5px; color: var(--fg); font-style: italic; }
.rv { font-weight: 700; color: var(--tone); }
.ck { display: inline-flex; align-items: center; gap: 4px; color: var(--tone); font-weight: 600; }
.ck .g { width: 13px; height: 13px; }
.bot { font-size: 11px; font-weight: 700; color: var(--idle); background: var(--idle-soft); border-radius: 4px; padding: 0 4px; }
.more { display: inline-flex; margin-top: 10px; font-size: 13px; font-weight: 600; min-height: 32px; align-items: center; }
.gcard .note { margin-top: 10px; }
.gcard .linkbtn { margin-top: 4px; }
.chain-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; margin-top: 4px; font-size: 12.5px; }
.cn { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
.cn .mono { font-size: 12px; font-weight: 700; }
.cn code { font-size: 11.5px; color: var(--muted); }
.cj { display: inline-block; width: 8px; }
.cj.says-j { width: auto; padding: 0 2px; color: var(--muted); }
.cj.says-j .ic { width: 12px; height: 12px; }
@media (max-width: 1199px) and (min-width: 1000px) {
  .desk { grid-template-columns: 240px minmax(0, 1fr) minmax(0, 1fr); }
  .desk.proj { grid-template-columns: 240px minmax(0, 1fr); }
  .desk.proj.docked { grid-template-columns: 240px minmax(0, 1fr) minmax(340px, 400px); }
  .desk.proj .queue { padding-left: 24px; padding-right: 24px; }
}
@media (max-width: 999px) {
  .desk.proj { grid-template-columns: minmax(0, 1fr); }
  .desk.proj.docked { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .desk.proj .queue { padding: 16px 16px 40px; }
  .desk.proj .stage { display: none; }
  body.reading .desk.proj .stage { display: flex; }
  .ph-t h1 { font-size: 21px; }
  .gcard { padding: 12px 14px 14px; }
  .dock-bar { display: none; }
  .desk.proj.docked .stage { display: none; }
  body.reading .desk.proj.docked .stage { display: flex; }
  .gsub a.ext, .gcard .prs a, .gcard .co a, .repo-l, .more, .gcard .linkbtn { display: inline-flex; align-items: center; min-height: 44px; }
  .jump button { min-height: 44px; }
}

/* projects page: one card per project */
.pcards { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; max-width: 1180px; }
.pcard { display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); color: var(--fg); text-decoration: none; position: relative; transition: border-color 150ms var(--ease), background-color 150ms var(--ease); }
.pcard::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 4px; border-radius: 8px 8px 0 0; background: var(--tone); }
.pcard:hover { text-decoration: none; border-color: var(--border-strong); background: var(--surface-2); }
.pcard:hover .pc-go { color: var(--accent); }
.pc-l:last-of-type { margin-bottom: 6px; }
.pc-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pc-n { font-size: 16.5px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; min-width: 0; }
.pc-w { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--tone); background: var(--tone-soft); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.pc-repo { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
.pc-repo .mono { font-size: 12.5px; }
.pc-l { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.pc-l code { font-size: 12.5px; color: var(--fg); }
.pc-l b { color: var(--fg); }
.pc-l .word { font-size: 12.5px; }
.pc-gh { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.pc-gh .ic { color: var(--muted); }
.pc-gh > span + .ic { margin-left: 8px; }
.pc-go { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; color: var(--muted); }

/* tablet: rail folds into a chip row */
@media (max-width: 999px) {
  .desk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .rail { display: none; }
  .chiprow { display: flex; }
}
/* phone: one item owns the screen */
@media (max-width: 760px) {
  .app { display: block; height: auto; }
  .top { padding: 0 12px 0 16px; gap: 4px; }
  .brand { margin-right: 4px; font-size: 15px; }
  .tab { padding: 0 10px; height: 44px; }
  .theme-label { display: none; }
  .btn { min-height: 44px; min-width: 44px; padding: 0 10px; }
  .switch { width: 100%; }
  .switch button { flex: 1; min-height: 44px; white-space: normal; line-height: 1.2; padding: 4px 8px; }
  .chip { min-height: 44px; }
  .desk { display: block; }
  .queue { overflow: visible; padding: 16px 16px 40px; border: 0; }
  .keys { display: none; }
  .search input { height: 44px; }
  .search kbd { display: none; }
  .row { min-height: 64px; padding: 10px 12px; column-gap: 10px; }
  .r1 { grid-column: 2 / 4; }
  .r2 { grid-column: 2 / 4; grid-row: 2; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .r-time { grid-column: 2; grid-row: 3; text-align: left; }
  .r2b { grid-column: 3; grid-row: 3; }
  .crow .c1 { grid-column: 2 / 4; }
  .crow .c-time { grid-column: 2 / 4; grid-row: 2; text-align: left; }
  .crow .c2 { grid-row: 3; } .crow .c3 { grid-row: 4; }
  .lrow { grid-template-columns: 64px minmax(0, 1fr) auto; align-items: start; }
  .stage { display: none; }
  body.reading { overflow: hidden; }
  body.reading .stage { display: flex; position: fixed; inset: 0; z-index: 20; padding: 0; background-image: none; align-items: stretch; }
  body.reading .m-bar { display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 56px; flex: none; background: var(--surface); border-bottom: 1px solid var(--border); }
  .m-bar .pos { flex: 1; text-align: center; font-size: 12.5px; color: var(--muted); }
  body.reading .panel { max-width: none; max-height: none; flex: 1; border-radius: 0; border: 0; box-shadow: none; }
  .p-head, .p-sec, .p-foot { padding-left: 16px; padding-right: 16px; }
  .gh li { grid-template-columns: 16px minmax(0, 1fr); }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .gh li .v { grid-column: 2; }
  .mini li { grid-template-columns: 16px auto minmax(0, 1fr); }
  .mini li .when { display: none; }
}
@container (max-width: 540px) { .facts { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  body += '<section class="p-sec"><h3>Landings<span class="aside">' + led.length + '</span></h3>' + (led.length ? '<ul class="mini">' + led.map(function (r) {
    var l = landed(r), off = l.on_default === false;
    return '<li class="t-' + (off ? 'idle' : 'ok') + '">' + ic('landed', 'sm') + '<code>' + esc(l.sha) + '</code><span class="why"><a href="#" data-goto="run:' + esc(r.run_id) + '" data-proj="' + esc(pid) + '">' + esc(r.run_id) + '</a> · ' + (off ? '<b>not on local ' + esc(br) + '</b>' + (l.branches && l.branches.length ? ', on ' + l.branches.map(esc).join(', ') : ', on no other local branch') : 'on local ' + esc(br)) + '</span><span class="when">' + esc(dateOnly(r.finished_at)) + '</span></li>';
  }).join('') + '</ul><p class="note">A landing that is not on local ' + esc(br) + ' went into another branch, or later work replaced it; the run record does not say which.</p>' : '<p class="nr" style="margin:0">No landing recorded.</p>') + '</section>';
  if (ac.length) body += '<section class="p-sec"><h3>Ahead of origin<span class="aside">newest first</span></h3><ul class="commits">' + ac.map(function (c) {
    return '<li class="k-' + c.kind + '"><code>' + esc(c.sha) + '</code><span class="kind">' + KIND[c.kind] + (c.run ? ' · <a href="#" data-goto="run:' + esc(c.run) + '" data-proj="' + esc(pid) + '">' + esc(num(c.run)) + '</a>' : '') + '</span><span class="subj">' + esc(c.subject) + '</span></li>';
  }).join('') + '</ul><p class="note">Sorted by commit subject (“Workflow &lt;run&gt;:”, “Merge feature/…/&lt;run&gt;”), read from git ' + esc(when(D.git_checked_at)) + '. The controller\'s ledger classifies by review record instead.</p></section>';
  if (lg) body += '<section class="p-sec"><h3>Ledger record<span class="aside">' + esc(when(lg.generated_at)) + '</span></h3><p class="lead-why" style="margin:0">' + ['reviewed', 'blocked', 'config', 'code'].map(function (k) { return '<b>' + lg.counts[k] + '</b> ' + k; }).join(' · ') + ' on <code>' + esc(lg.branch) + '</code>' + (lg.since ? ' since <code>' + esc(lg.since.slice(0, 7)) + '</code>' : ', whole history') + '.</p></section>';
  body += '<section class="p-sec"><h3>Command</h3>' + cmdBox('python -m workflow ledger --repo ' + p.local.repository + ' --branch ' + br + (ahead ? ' --since origin/' + br : ''), 'main') + '<p class="cmd-why">Classifies each first-parent commit as reviewed by an approved run, from a blocked run\'s candidate, or outside any run, and writes ledger.json beside the registry. Nothing is pushed.</p></section>';
  return '<article class="panel t-none"><header class="p-head"><div class="p-top">' + ic('branch') + '<h2>local ' + esc(br) + '</h2>' + (ahead ? '<span class="meta"><span class="ahead">' + ahead + ' ahead</span> of origin</span>' : '') + '</div>' +
    '<p class="p-sub"><a href="#p-' + esc(pid) + '">' + esc(p.name) + '</a><span>·</span><span class="mono">' + esc(p.local.repository) + '</span><span>·</span><span>checkout <code>' + esc(p.local.checkout_branch) + '</code></span></p></header>' +
    '<div class="p-body">' + body + '</div></article>';
}
function repoPanel(repo, pid) {
  var g = D.github[repo], cos = REPOS.get(repo);
  var prs = g ? g.prs.filter(function (x) { return x.state === 'OPEN'; }).sort(function (a, b) { return (b.author === OPERATOR) - (a.author === OPERATOR) || Date.parse(b.updated_at) - Date.parse(a.updated_at); }) : [];
  var merged = g ? g.prs.filter(function (x) { return x.state === 'MERGED'; }).length : 0;
  var body = '<section class="p-sec"><h3>Checkouts of this repo<span class="aside">' + cos.length + '</span></h3><ul class="co">' + cos.map(function (p) {
    return '<li><a href="#p-' + esc(p.project_id) + '">' + esc(p.name) + '</a><span class="meta">on <code>' + esc(p.local.checkout_branch) + '</code> · ' + syncHTML(p) + '</span></li>';
  }).join('') + '</ul></section>';
  if (g) {
    body += '<section class="p-sec"><h3>Open pull requests<span class="aside">' + prs.length + ' open · ' + merged + ' recently merged</span></h3>' + (prs.length ? '<ul class="prs">' + prs.map(function (x) {
      return '<li>' + ic('pr') + '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">#' + x.number + ' ' + esc(x.title) + '</a><span class="pm">' + (x.author === OPERATOR ? '<span class="mine">yours</span>' : '<span>' + esc(x.author) + '</span>') + '<code>' + esc(x.branch) + '</code><span>updated ' + esc(when(x.updated_at)) + '</span>' + (x.draft ? '<span>draft</span>' : '') + '</span></li>';
    }).join('') + '</ul>' : '<p class="nr" style="margin:0">No open pull requests.</p>') + '<p class="note">Repo context only: no run opened a PR.</p></section>';
    body += '<section class="p-sec"><h3>Issues<span class="aside">' + g.open_issues + ' open</span></h3>' + (g.issues.length ? '<ul class="prs">' + g.issues.slice(0, 5).map(function (x) {
      return '<li>' + ic('issue') + '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">#' + x.number + ' ' + esc(x.title) + '</a><span class="pm"><span>updated ' + esc(when(x.updated_at)) + '</span></span></li>';
    }).join('') + '</ul>' : '<p class="nr" style="margin:0">No open issues listed.</p>') + '</section>';
  } else body += '<section class="p-sec"><p class="nr">GitHub was not read for this repo.</p></section>';
  var pub = g && g.visibility === 'PUBLIC';
  return '<article class="panel t-none"><header class="p-head"><div class="p-top">' + ic('repo') + '<h2>' + esc(repo) + '</h2>' + visChip(repo) + '</div>' +
    '<p class="p-sub"><span>default branch <code>' + esc(g ? g.default_branch : '') + '</code></span><span>·</span><span>read ' + hm(D.github_read_at) + ' UTC</span>' + (pub ? '<span>·</span><span>public: pushing publishes</span>' : '') + '</p></header>' +
    '<div class="p-body">' + body + '</div><footer class="p-foot"><a class="ink" href="' + ghUrl(repo) + '" target="_blank" rel="noopener">' + ic('ext') + 'Open on GitHub</a></footer></article>';
}
function badPanel(f) {
  var p = f._p;
  return '<article class="panel t-idle"><header class="p-head"><div class="p-top">' + gl('idle', 'lg') + '<h2>' + esc(f.workflow_id) + '</h2><span class="pill t-idle">' + gl('idle') + 'cannot be read</span></div>' +
    '<p class="p-sub"><a href="#p-' + esc(p.project_id) + '">' + esc(p.name) + '</a><span>·</span><span>' + esc(p.github) + '</span><span>·</span><span>on <code>' + esc(p.local.checkout_branch) + '</code></span></p></header>' +
    '<div class="p-body"><section class="p-sec"><p class="lead-at">The viewer cannot read this feature\'s runs</p><p class="lead-why">When checked on 10 Oct its <code>run-state.json</code> was version 1.12.0, newer than this viewer reads (up to 1.11.0). The snapshot recorded only <code>' + esc(f.load_error.error) + '</code>. Its runs are not counted as failed, or at all.</p></section>' +
    '<section class="p-sec"><h3>Next command</h3>' + cmdBox(badCmd(f), 'bad') + '<p class="cmd-why">The controller reads the newer state. Put in the run id; the viewer could not read it.</p></section></div>' +
    '<footer class="p-foot"><a class="ink" href="#f-' + esc(f._key) + '">Open feature <kbd>Enter</kbd></a></footer></article>';
}
function emptyPanel() {
  return '<article class="panel t-none"><header class="p-head"><div class="p-top"><h2 style="font-family:var(--font-body)">Nothing selected</h2></div></header><div class="p-body"><section class="p-sec"><p class="lead-why" style="margin:0">Pick a row, or press <kbd>j</kbd>.</p></section></div></article>';
}

/* ---------- selection ---------- */
function items() { return Array.prototype.filter.call($queue.querySelectorAll('[data-sel]'), function (el) { return el.offsetParent !== null || el.getClientRects().length; }); }
function itemEl(key) { return $queue.querySelector('[data-sel="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]'); }
function renderReading(key) {
  var html = emptyPanel(), i = key ? key.indexOf(':') : -1, kind = key ? key.slice(0, i) : '', id = key ? key.slice(i + 1) : '';
  if (kind === 'run') { var r = findRun(id); if (r) html = runPanel(r); }
  else if (kind === 'feat' && F.has(id)) html = featPanel(F.get(id));
  else if (kind === 'bad' && F.has(id)) html = badPanel(F.get(id));
  else if (kind === 'repo' && REPOS.has(id)) html = repoPanel(id);
  else if (kind === 'main' && P.has(id)) html = mainPanel(id);
  var list = items(), pos = list.indexOf(itemEl(key));
  var bar = '<div class="m-bar"><button type="button" class="btn" data-act="close">' + ic('back') + 'Queue</button><span class="pos">' + (pos >= 0 ? (pos + 1) + ' of ' + list.length : '') + '</span><button type="button" class="btn" data-act="next"' + (pos < 0 || pos >= list.length - 1 ? ' disabled' : '') + '>Next' + ic('chev') + '</button></div>';
  var dock = '<div class="dock-bar"><span>' + (pos >= 0 ? (pos + 1) + ' of ' + list.length + ' · j k move' : '') + '</span><button type="button" class="btn quiet" data-act="undock">Close <kbd>Esc</kbd></button></div>';
  $stage.innerHTML = bar + dock + html;
  var pnl = $stage.querySelector('.panel'); if (pnl) pnl.classList.add('fade');
}
function select(key, opt) {
  opt = opt || {};
  sel = key; selMem[route.key] = key;
  Array.prototype.forEach.call($queue.querySelectorAll('[aria-selected="true"]'), function (el) { el.setAttribute('aria-selected', 'false'); });
  var el = key ? itemEl(key) : null;
  if (el) { el.setAttribute('aria-selected', 'true'); if (opt.focus) el.focus({ preventScroll: true }); if (opt.scroll !== false) el.scrollIntoView({ block: 'nearest' }); }
  renderReading(key);
  document.querySelector('.desk').classList.toggle('docked', route.page === 'project' && !!key);
}
function move(d) {
  var list = items(); if (!list.length) return;
  var i = list.indexOf(itemEl(sel)), n = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + d));
  select(list[n].getAttribute('data-sel'), { focus: true });
}
function isPhone() { return window.matchMedia('(max-width: 760px)').matches; }
function openReading() { if (isPhone()) { document.body.classList.add('reading'); var b = $stage.querySelector('.p-body'); if (b) b.scrollTop = 0; } }
function closeReading() { if (document.body.classList.contains('reading')) { document.body.classList.remove('reading'); var el = itemEl(sel); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center' }); } } }
function undock() {
  if (route.page !== 'project' || !sel) return;
  var el = itemEl(sel); select(null); if (el) el.focus({ preventScroll: true });
}
function openSel() {
  if (!sel) return;
  var i = sel.indexOf(':'), kind = sel.slice(0, i), id = sel.slice(i + 1);
  document.body.classList.remove('reading');
  if (kind === 'run') nav('#run-' + id);
  else if (kind === 'feat' || kind === 'bad') nav('#f-' + id);
  else if (kind === 'repo') { var a = $stage.querySelector('.p-foot a'); if (a) a.focus(); }
}
function defaultSel() {
  if (route.page === 'run') return 'run:' + route.id;
  if (route.page === 'project' || route.page === 'projects') return null;
  if (route.page === 'feature' && F.get(route.fkey).load_error) return 'bad:' + route.fkey;
  var list = items(); return list.length ? list[0].getAttribute('data-sel') : null;
}

/* ---------- filter ---------- */
function applyFilter() {
  var q = document.getElementById('q'); var v = q ? q.value.trim().toLowerCase() : '';
  Array.prototype.forEach.call($queue.querySelectorAll('[data-hay]'), function (el) {
    var hit = !v || el.getAttribute('data-hay').indexOf(v) >= 0;
    var host = el.closest('.cnode') || el; host.hidden = !hit;
  });
  if (v && !earlierOpen) { var fb = document.getElementById('earlier-body'); if (fb) fb.hidden = false; }
  if (!v && !earlierOpen) { var fb2 = document.getElementById('earlier-body'); if (fb2) fb2.hidden = true; }
  Array.prototype.forEach.call($queue.querySelectorAll('.sheet'), function (sh) {
    var all = sh.querySelectorAll('[data-hay]'); if (!all.length) return;
    var any = Array.prototype.some.call(all, function (el) { return !(el.closest('.cnode') || el).hidden; });
    sh.classList.toggle('filtered-empty', !!v && !any);
  });
}

/* ---------- render ---------- */
function render() {
  route = parseRoute();
  var changed = route.key !== lastRouteKey; lastRouteKey = route.key;
  renderStrip(); renderRail();
  document.querySelector('.desk').classList.toggle('proj', route.page === 'project' || route.page === 'projects');
  var q = document.getElementById('q'), qv = q && !changed ? q.value : '';
  var html = route.page === 'projects' ? projectsHTML() : route.page === 'project' ? projectHTML(route.pid) : route.page === 'feature' ? featureHTML(route.fkey) : route.page === 'run' ? runStubHTML(route.id) : homeHTML();
  $queue.innerHTML = html;
  if (qv) { document.getElementById('q').value = qv; applyFilter(); }
  var k = route.page === 'run' ? 'run:' + route.id : selMem[route.key];
  if (!k || (!itemEl(k) && !(k.indexOf('run:') === 0 && findRun(k.slice(4))))) k = defaultSel();
  if (changed) { $queue.scrollTop = 0; if (isPhone()) window.scrollTo(0, 0); }
  select(k, { scroll: !changed });
  var t = { projects: 'Projects', home: 'Triage', project: route.pid, feature: route.fkey && F.get(route.fkey).workflow_id, run: route.id }[route.page];
  document.title = 'Dispatch Desk · ' + t;
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target;
  var inert = t.closest('[data-inert]'); if (inert) { e.preventDefault(); return; }
  var ln = t.closest('a[href^="#"]');
  if (ln && !ln.hasAttribute('data-goto') && ln.getAttribute('href').length > 1 && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); nav(ln.getAttribute('href')); return; }
  var m = t.closest('[data-mode]'); if (m) { MODE = m.getAttribute('data-mode'); selMem = {}; render(); return; }
  var cp = t.closest('[data-copy]'); if (cp) { copyFrom(cp); return; }
  var go = t.closest('[data-goto]');
  if (go) {
    e.preventDefault();
    var key = go.getAttribute('data-goto');
    if (itemEl(key)) { select(key, { focus: !isPhone() }); var b = $stage.querySelector('.p-body'); if (b) b.scrollTop = 0; }
    else if (key.indexOf('repo:') === 0) { var pid = go.getAttribute('data-proj'); selMem['p-' + pid] = key; nav('#p-' + pid); }
    else if (key.indexOf('run:') === 0) { var r = findRun(key.slice(4)); if (r) { selMem['f-' + r._f._key] = key; document.body.classList.remove('reading'); nav('#f-' + r._f._key); } }
    return;
  }
  var act = t.closest('[data-act]');
  if (act) {
    var a = act.getAttribute('data-act');
    if (a === 'earlier') { earlierOpen = !earlierOpen; store.set('dispatch.earlier', earlierOpen ? '1' : null); render(); var f = $queue.querySelector('[data-act="earlier"]'); if (f) f.focus(); }
    else if (a === 'seen-mark') { store.set('dispatch.seenAt', new Date(NOW).toISOString()); render(); }
    else if (a === 'seen-reset') { store.set('dispatch.seenAt', null); render(); }
    else if (a === 'desc') { descOpen = !descOpen; render(); }
    else if (a === 'close') closeReading();
    else if (a === 'undock') undock();
    else if (a === 'jump') { var to = act.getAttribute('data-to'), el = document.getElementById(to) || $queue.querySelector('[data-sec="' + to + '"]'); if (el) { el.scrollIntoView({ block: 'start', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }); } }
    else if (a === 'list') { var id = act.getAttribute('data-list'), st = $queue.scrollTop; listOpen[id] = !listOpen[id]; render(); $queue.scrollTop = st; var nb = $queue.querySelector('[data-list="' + id + '"]'); if (nb) nb.focus({ preventScroll: true }); }
    else if (a === 'next') { move(1); var b2 = $stage.querySelector('.p-body'); if (b2) b2.scrollTop = 0; }
    return;
  }
  var pick = t.closest('[data-pick]'); if (pick) { select(pick.getAttribute('data-pick'), { focus: false }); openReading(); return; }
  var row = t.closest('[data-sel]');
  if (row && $queue.contains(row)) { select(row.getAttribute('data-sel'), { focus: false, scroll: false }); openReading(); }
});
$queue.addEventListener('dblclick', function (e) { if (e.target.closest('[data-sel]')) openSel(); });
$queue.addEventListener('input', function (e) { if (e.target.id === 'q') applyFilter(); });

function copyFrom(btn) {
  var code = document.getElementById(btn.getAttribute('data-copy')); if (!code) return;
  var text = code.textContent, label = btn.querySelector('span');
  function flash(word) { if (label) { label.textContent = word; setTimeout(function () { label.textContent = 'Copy'; }, 1600); } }
  function selectIt() { try { var rg = document.createRange(); rg.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); } catch (x) { /* nothing to select into */ } flash('Selected'); }
  try { navigator.clipboard.writeText(text).then(function () { flash('Copied'); }, selectIt); } catch (x) { selectIt(); }
}

var gAt = 0;
document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target, typing = t && t.matches && t.matches('input, textarea, select');
  if (typing) {
    if (e.key === 'Escape') { t.value = ''; applyFilter(); t.blur(); }
    else if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); t.blur(); var l = items(); if (l.length) select(l[0].getAttribute('data-sel'), { focus: true }); }
    return;
  }
  var onRow = t && t.closest && t.closest('[data-sel]');
  var onControl = t && t.closest && t.closest('a, button, summary') && !onRow;
  switch (e.key) {
    case 'j': move(1); e.preventDefault(); break;
    case 'k': move(-1); e.preventDefault(); break;
    case 'ArrowDown': if (!onControl || onRow) { move(1); e.preventDefault(); } break;
    case 'ArrowUp': if (!onControl || onRow) { move(-1); e.preventDefault(); } break;
    case 'Enter': if (!onControl) { e.preventDefault(); openSel(); } break;
    case 'c': { var b = $stage.querySelector('[data-copy]'); if (b) { e.preventDefault(); copyFrom(b); } break; }
    case '/': { var q = document.getElementById('q'); if (q) { e.preventDefault(); q.focus(); q.select(); } break; }
    case 'g': gAt = Date.now(); break;
    case 'h': if (Date.now() - gAt < 1200) { gAt = 0; nav('#home'); } break;
    case 'p': if (Date.now() - gAt < 1200) { gAt = 0; nav('#projects'); } break;
    case 'Escape': if (document.body.classList.contains('reading')) closeReading(); else undock(); break;
  }
});
/* Enter on a focused row opens it; a click on it only selects */
$queue.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.closest('[data-sel]')) { e.preventDefault(); e.stopPropagation(); select(e.target.closest('[data-sel]').getAttribute('data-sel'), { focus: true }); openSel(); } });

/* theme: follows the system until chosen; the choice is a convenience on this device */
var themes = ['auto', 'light', 'dark'], theme = store.get('dispatch.theme') || 'auto';
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
  var b = document.getElementById('theme');
  b.innerHTML = ic(theme === 'auto' ? 'auto' : theme === 'light' ? 'sun' : 'moon') + '<span class="theme-label">' + (theme === 'auto' ? 'Auto' : theme === 'light' ? 'Light' : 'Dark') + '</span>';
  b.setAttribute('aria-label', 'Theme: ' + (theme === 'auto' ? 'follows the system' : theme) + '. Change theme');
}
document.getElementById('theme').addEventListener('click', function () { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set('dispatch.theme', theme === 'auto' ? null : theme); applyTheme(); });
applyTheme();

function fromLocation() { if ((location.hash || '') === HASH) return; HASH = location.hash || ''; document.body.classList.remove('reading'); render(); }
window.addEventListener('hashchange', fromLocation);
window.addEventListener('popstate', fromLocation);
window.addEventListener('resize', function () { if (!isPhone()) document.body.classList.remove('reading'); });
window.__dispatch = { setMode: function (m) { MODE = m; selMem = {}; render(); }, open: openReading };
render();
})();
</script>
